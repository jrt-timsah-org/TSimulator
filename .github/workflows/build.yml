name: Build, test and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            rid: linux-x64
          - os: windows-2025
            rid: win-x64
          - os: macos-15
            rid: osx-arm64
          - os: macos-15-intel
            rid: osx-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: dotnet restore TSimulator.slnx --locked-mode
      - run: dotnet build TSimulator.slnx -c Release --no-restore
      - run: dotnet test TSimulator.slnx -c Release --no-build --logger trx --results-directory artifacts/tests
      - name: Native graphics smoke (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libx11-6 libxrandr2 libxi6 libxcursor1 libxinerama1
          xvfb-run -a dotnet run --project src/TSimulator.Desktop -c Release --no-build -- --smoke 10 --screenshot artifacts/smoke.png
      - name: Robot builder, settings and recording UI flow (Linux)
        if: runner.os == 'Linux'
        shell: bash
        run: |
          xvfb-run -a dotnet run --project src/TSimulator.Desktop -c Release --no-build -- --smoke 180 --builder --user-data artifacts/ui-profile --automation tests/ui/builder-flow.rae --screenshot artifacts/ui-flow.png
          xvfb-run -a dotnet run --project src/TSimulator.Desktop -c Release --no-build -- --smoke 60 --settings --scenario artifacts/ui-profile/scenario.json --user-data artifacts/ui-numeric --automation tests/ui/numeric-flow.rae --screenshot artifacts/ui-numeric.png
          python scripts/verify-ui-flow.py artifacts/ui-profile artifacts/ui-numeric
          for replay in artifacts/ui-profile/replays/*.jsonl; do
            dotnet run --project src/TSimulator.Cli -c Release --no-build -- replay "$replay"
          done
          xvfb-run -a dotnet run --project src/TSimulator.Desktop -c Release --no-build -- --smoke 3 --builder --scenario artifacts/ui-profile/scenario.json --screenshot artifacts/builder.png
      - name: Native library compatibility (all platforms)
        run: dotnet run --project src/TSimulator.Desktop -c Release --no-build -- --native-check
      - name: Replay round-trip
        shell: bash
        run: |
          dotnet run --project src/TSimulator.Cli -c Release --no-build -- simulate --seconds 20 --record artifacts/test.jsonl
          dotnet run --project src/TSimulator.Cli -c Release --no-build -- replay artifacts/test.jsonl
      - name: Publish desktop
        run: dotnet publish src/TSimulator.Desktop -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -o artifacts/publish
      - name: Publish CLI alongside desktop
        run: dotnet publish src/TSimulator.Cli -c Release -r ${{ matrix.rid }} --self-contained true -p:PublishSingleFile=false -o artifacts/publish
      - name: Package
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          if [[ "$GITHUB_REF_TYPE" != "tag" ]]; then version="$(dotnet msbuild src/TSimulator.Desktop/TSimulator.Desktop.csproj -getProperty:Version)-dev"; fi
          python scripts/package.py --rid '${{ matrix.rid }}' --input artifacts/publish --version "$version"
      - uses: actions/upload-artifact@v4
        with:
          name: TSimulator-${{ matrix.rid }}
          path: |
            artifacts/TSimulator-*.zip
            artifacts/TSimulator-*.sha256
            artifacts/smoke.png
            artifacts/ui-flow.png
            artifacts/ui-numeric.png
            artifacts/builder.png
            artifacts/tests/*.trx
          if-no-files-found: error
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: TSimulator-*
          path: artifacts
          merge-multiple: true
      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" artifacts/TSimulator-*.zip artifacts/TSimulator-*.sha256 --title "TSimulator $GITHUB_REF_NAME" --notes-file .github/release-notes.md --verify-tag
